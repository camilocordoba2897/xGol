{% extends 'base.html' %}

{% block Titulo %}
  Pago confirmado
{% endblock %}

{% block content %}

  <div style="max-width: 600px; margin: 0 auto;">

    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 78px; height: 78px; border-radius: 50%; background: var(--accent-deep); display: grid; place-items: center; margin: 0 auto 16px;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="font-family: var(--ff-display); font-size: 1.7rem; color: var(--text-0); margin-bottom: 6px;">¡Pago exitoso!</h2>
      <p style="color: var(--text-2);">Tu suscripción ya está activa y lista para usar</p>
    </div>

  </div>

{% endblock %}
