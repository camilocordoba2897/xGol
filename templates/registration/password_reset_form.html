{% extends 'base.html' %}

{% block Titulo %}
  Recuperar contraseña
{% endblock %}

{% block content %}
  <h2 class="section-title" style="text-align: center;">Recuperar contraseña</h2>
  <p class="section-subtitle" style="text-align: center;">Escribe tu correo y te enviaremos un enlace para restablecerla</p>

  <div class="card card--static" style="max-width: 440px; margin: 0 auto;">
    <form action="" method="POST">
      {% csrf_token %}

      <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px;">
        <label style="font-family: var(--ff-display); font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-2);">Correo</label>
        <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required
               style="font-family: var(--ff-body); background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 14px; color: var(--text-0); outline: none;">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
        Enviar enlace
      </button>
    </form>
  </div>
{% endblock %}
